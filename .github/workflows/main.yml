name: Build Game

on:
  push:
    branches: [ main ] # 깃허브 데스크탑으로 푸시할 때 실행

jobs:
  # --------------------------------------------------
  # [박스 1] 빌드 작업 (질문자님의 기존 빌드 코드)
  # --------------------------------------------------
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      
      - name: Setup Haxelib Path
        run: |
          haxelib setup C:\haxelib

      - name: Cache Windows Build Object Files
        uses: actions/cache@v4
        with:
          path: |
            C:\haxelib
            export/release/windows/obj
            C:\hostedtoolcache\windows\haxe\4.3.7\x64\lib\hxcpp
            .haxecache
          key: ${{ runner.os }}-build-obj-${{ hashFiles('**/Project.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-obj-

      - name: Install Libraries
        run: |
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.2.2
          haxelib install flixel-ui 2.6.1
          haxelib install flixel-tools
          haxelib install hscript 1.1.3
          haxelib install hxdiscord_rpc 1.2.4
          haxelib install flxanimate
          haxelib install hxcpp
          haxelib install hscript-iris 1.1.3
          haxelib install tjson 1.4.0
          haxelib install hxvlc 2.0.1
          haxelib git discord_rpc https://github.com
          haxelib git linc_luajit https://github.com
          haxelib run lime setup

      - name: Build Psych Engine
        env:
          HAXE_CACHE: .haxecache
          HAXE_COMPILER_CACHE: .haxecache
        run: |
          haxelib run lime build windows
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNF-BattleCats-Build
          path: export/release/windows/bin/

  # --------------------------------------------------
  # [박스 2] 배달 작업 (빌드 박스 뒤에 선으로 연결되어 실행됨!)
  # --------------------------------------------------
  deliver_file:
    runs-on: windows-latest
    needs: build # 👈 [초특급 핵심!] 이 명령어가 들어가야만 화면에서 빌드 박스 뒤에 화살표로 연결됩니다!
    
    steps:
      # 1. 같은 워크플로우의 build 단계에서 구운 보관함을 가져옵니다.
      - name: Download Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: FNF-BattleCats-Build
          path: ./extracted_files

      # 2. 파일이 배달될 대상 리포지토리를 가져옵니다.
      - name: Checkout Target Release Repository
        uses: actions/checkout@v4
        with:
          repository: 'Tubenyan-Official-YT/fnf-battle-cats-legend-begins'
          token: ${{ secrets.FNF_TOKEN }}
          path: ./target_repo

      # 3. 배달할 파일 딱 하나만 복사합니다.
      - name: Copy Specific File Only
        run: |
          cp ./extracted_files/battleCatsLegendBegins.exe ./target_repo/

      # 4. 대상 리포지토리에 푸시하여 배달을 완료합니다.
      - name: Push File to Target Repo
        run: |
          cd ./target_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add .
          git commit -m "Legend Engine 자동 업데이트 빌드 파일 배달 완료" || echo "변경 사항 없음"
          git push origin main
