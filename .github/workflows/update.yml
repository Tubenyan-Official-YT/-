name: Update Deliver

on:
  workflow_run:
    workflows: ["Build Game"] # 👈 기존 빌드 파일 맨 위에 적힌 name과 똑같이 맞춰 정렬합니다.
    types:
      - completed

jobs:
  deliver_file:
    # 이전 빌드가 에러 없이 '성공'했을 때만 이어서 실행하도록 안전장치를 겁니다.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      # 1. 이전 빌드에서 업로드해 둔 보관함(FNF-BattleCats-Build)에서 결과물 파일들을 가져옵니다.
      - name: Download Artifact from Previous Build
        uses: actions/download-artifact@v4
        with:
          name: FNF-BattleCats-Build
          run-id: ${{ github.event.workflow_run.id }} # 이전 빌드의 ID를 추적해 가져옴
          path: ./extracted_files

      # 2. 결과물 파일 중 '특정 파일 하나'를 배달해서 집어넣을 다른 대상 리포지토리를 가져옵니다.
      - name: Checkout Target Release Repository
        uses: actions/checkout@v4
        with:
          repository: 'Tubenyan-Official-YT/fnf-battle-cats-legend-begins' # 👈 파일이 이동할 대상 레포 이름 입력
          token: ${{ secrets.FNF_TOKEN }} # 레포 접근 권한 토큰 (Secrets 등록 필요)
          path: ./target_repo

      # 3. [핵심] 아티팩트 폴더에서 내가 원하는 특정 파일 '딱 하나'만 대상 리포지토리 폴더로 복사합니다.
      - name: Copy Specific File Only
        run: |
          cp ./extracted_files/battleCatsLegendBegins.exe ./target_repo/

      # 4. 대상 리포지토리에 복사된 파일을 커밋하고 깃허브에 전송(Push)합니다.
      - name: Push File to Target Repo
        run: |
          cd ./target_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Legend Engine 자동 업데이트 빌드 파일 배달 완료" || echo "변경 사항 없음"
          git push origin main
